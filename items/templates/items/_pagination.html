{% load items_extras %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-4 d-flex justify-content-center" aria-label="{{ tab|title }} pages">
  <ul class="pagination mb-0">
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link" {% if page_obj.has_previous %}href="{% page_url param page_obj.previous_page_number tab %}"{% endif %} aria-label="Previous page"><i class="bi bi-chevron-left"></i></a>
    </li>
    {% elided_pages page_obj as pages %}
    {% for n in pages %}
      {% if n|is_ellipsis %}
      <li class="page-item disabled"><span class="page-link">…</span></li>
      {% else %}
      <li class="page-item {% if n == page_obj.number %}active{% endif %}">
        <a class="page-link" href="{% page_url param n tab %}" {% if n == page_obj.number %}aria-current="page"{% endif %}>{{ n }}</a>
      </li>
      {% endif %}
    {% endfor %}
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
      <a class="page-link" {% if page_obj.has_next %}href="{% page_url param page_obj.next_page_number tab %}"{% endif %} aria-label="Next page"><i class="bi bi-chevron-right"></i></a>
    </li>
  </ul>
</nav>
{% endif %}
