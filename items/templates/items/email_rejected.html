{% extends "base.html" %}

{% block title %}Access Denied — Campus Lost & Found{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="card shadow-sm border-danger">
      <div class="card-body py-5">
        <i class="bi bi-x-octagon display-1 text-danger"></i>
        <h3 class="mt-3">Access Denied</h3>
        <p class="text-muted">
          The email <strong>{{ email }}</strong> is not allowed.<br>
          Please sign in with your <strong>@{{ allowed_domain }}</strong> college email.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">
          <i class="bi bi-arrow-left"></i> Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
