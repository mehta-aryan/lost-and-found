{% extends "base.html" %}

{% block title %}Delete: {{ item.title }} — Campus Lost & Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0"><i class="bi bi-trash"></i> Confirm Deletion</h5>
      </div>
      <div class="card-body text-center py-4">
        <p class="fs-5">Are you sure you want to delete <strong>"{{ item.title }}"</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash"></i> Yes, Delete
            </button>
            <a href="{% url 'item_detail' item.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
