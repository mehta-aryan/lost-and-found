{# One labelled form field. Usage: {% include "items/_field.html" with field=form.title %} #}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}{% if not field.field.required %}<span class="optional">optional</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<div class="field-error" role="alert">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
